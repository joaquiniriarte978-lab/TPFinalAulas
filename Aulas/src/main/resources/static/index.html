<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Aulas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="toast-container"></div>

<div id="page-login" class="login-page">
    <div class="login-bg"></div>

    <div class="login-card">
        <div class="login-brand">
            <h1>Gestión de Aulas</h1>
            <p>Ingresá tus credenciales para continuar</p>
        </div>



        <div class="form-group">
            <label class="form-label" for="login-user">Email</label>
            <input
                    class="form-input" type="text" id="login-user"
                    placeholder="ejemplo@correo.com" autocomplete="username"
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="login-pass">Contraseña</label>
            <input
                    class="form-input" type="password" id="login-pass"
                    placeholder="••••••••" autocomplete="current-password"
            >
        </div>

        <p id="login-error" style="
            color:var(--clr-danger);font-size:.83rem;
            margin-bottom:12px;display:none;
        "></p>


        <button class="btn btn-primary btn-full" id="btn-login">
            Iniciar sesión
        </button>
    </div>
</div>

<div id="page-app" style="display:none">
    <div id="app">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="logo-mark">
                    <div>
                        <h1>AulasSys</h1>
                        <span>v1.0.0</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-user">
                <div class="user-chip">
                    <div class="user-avatar" id="user-avatar">?</div>
                    <div class="user-info">
                        <div class="user-name" id="user-name">—</div>
                        <div class="user-role" id="user-role">—</div>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-label">Principal</div>
                <button class="nav-item active" data-section="aulas">Aulas</button>
                <button class="nav-item" data-section="materias">Materias</button>
                <button class="nav-item" data-section="reservas">Reservas</button>
                <button class="nav-item" data-section="avisos">Avisos</button>

                <div class="nav-section-label">Gestión</div>
                <button class="nav-item" data-section="usuarios">Usuarios</button>
                <button class="nav-item" data-section="comision">Comisiones</button>
            </nav>
            <button class="nav-item" data-section="perfil">Mi Perfil</button>
            <div class="sidebar-footer">
                <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <div class="main-content">
            <header class="topbar">
                <button class="hamburger" id="hamburger">&#9776;</button>
                <span class="topbar-title" id="topbar-title">Aulas</span>
            </header>

            <main class="page-body" id="page-body">
            </main>
        </div>

    </div>
</div>


<script src="js/config.js"></script>
<script src="js/services.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
