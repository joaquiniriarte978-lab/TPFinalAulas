<div class="page-heading">
  <div>
    <h1>Mi perfil</h1>
    <p>Actualizá tus datos de acceso.</p>
  </div>
</div>

<section class="panel form-panel">
  @if (auth.user()?.id == null) {
    <p class="alert">
      Las cuentas de prueba no permiten editar el perfil. Usá una cuenta registrada.
    </p>
  }
  @if (error()) {
    <p class="alert" role="alert">{{ error() }}</p>
  }
  <form [formRoot]="perfilForm">
    <fieldset [disabled]="auth.user()?.id == null">
      <label for="perfil-nombre">Nombre</label>
      <input id="perfil-nombre" [formField]="perfilForm.nombre" />
      <app-field-error [field]="perfilForm.nombre" />

      <label for="perfil-email">Correo</label>
      <input id="perfil-email" [formField]="perfilForm.email" type="email" />
      <app-field-error [field]="perfilForm.email" />

      <label for="perfil-password">Nueva contraseña</label>
      <input
        id="perfil-password"
        [formField]="perfilForm.password"
        type="password"
        autocomplete="new-password"
      />
      <app-field-error [field]="perfilForm.password" />
      <small class="field-hint">
        Dejala vacía para conservar la actual. Usá al menos 8 caracteres y una mayúscula.
      </small>

      <div class="dialog-actions">
        <button class="button primary" type="submit" [disabled]="submitting()">
          Guardar cambios
        </button>
      </div>
    </fieldset>
  </form>
</section>
