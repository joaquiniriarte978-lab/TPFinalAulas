<dialog #dialog aria-labelledby="dialog-title" (cancel)="cancel($event)">
  <div class="dialog-heading">
    <div>
      <h2 id="dialog-title">{{ title() }}</h2>
    </div>
    <button
      type="button"
      class="icon-button"
      aria-label="Cerrar ventana"
      [disabled]="busy()"
      (click)="closed.emit()"
    >
      ×
    </button>
  </div>
  <ng-content />
</dialog>
