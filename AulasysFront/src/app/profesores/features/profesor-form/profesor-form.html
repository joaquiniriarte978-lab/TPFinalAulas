<div class="page-heading">
  <div>
    <h1>Asignar materias</h1>
    @if (profesor(); as p) {
      <p>{{ p.nombre }} ({{ p.email }})</p>
    }
  </div>
  <button class="button secondary" type="button" (click)="cancelar()">Volver al listado</button>
</div>

<section class="panel form-panel">
  @if (error()) {
    <div class="alert" role="alert">{{ error() }}</div>
  }
  @if (profesor()) {
    <div>
      @for (m of materias(); track m.id) {
        <label class="checkbox-field">
          <input type="checkbox" [checked]="selected().includes(m.id)" (change)="toggle(m.id)" />
          <span>{{ m.nombre }}</span>
        </label>
      }
    </div>
    <p class="field-hint">No se pueden quitar materias con comisiones vigentes.</p>
    <div class="dialog-actions">
      <button class="button secondary" type="button" (click)="cancelar()">Cancelar</button>
      <button class="button primary" type="button" [disabled]="submitting()" (click)="guardar()">
        Guardar
      </button>
    </div>
  }
</section>
