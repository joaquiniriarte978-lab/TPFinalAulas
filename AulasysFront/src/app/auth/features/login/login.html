<main class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <h1>Gestión de Aulas</h1>
      <p>Ingresá tus credenciales para continuar</p>
    </div>
    @if (auth.notice()) {
      <div class="notice" role="status">{{ auth.notice() }}</div>
    }
    @if (error()) {
      <div class="alert" role="alert">{{ error() }}</div>
    }
    <form [formRoot]="loginForm">
      <label for="username">Email o usuario</label>
      <input
        id="username"
        [formField]="loginForm.username"
        autocomplete="username"
        placeholder="ejemplo@correo.com"
      />
      <app-field-error [field]="loginForm.username" />

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        [formField]="loginForm.password"
        autocomplete="current-password"
        placeholder="••••••••"
      />
      <app-field-error [field]="loginForm.password" />

      <button class="button primary login-submit" type="submit">Iniciar sesión</button>
    </form>
  </div>
</main>
